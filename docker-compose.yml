services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data/pglite_db
      - STOCKFISH_PATH=/usr/games/stockfish
      - STOCKFISH_THREADS=2
      - STOCKFISH_HASH=128
    volumes:
      - aetherchess-data:/app/data/pglite_db
    restart: unless-stopped

volumes:
  aetherchess-data: